<script>
  function isDesktopNav() { return window.matchMedia('(min-width: 1024px)').matches; }

  function openNav() { document.documentElement.classList.add('nav-open'); }
  function closeNav() { document.documentElement.classList.remove('nav-open'); }

  function toggleNav() {
    const root = document.documentElement;
    if (isDesktopNav()) {
      const collapsed = root.classList.toggle('nav-collapsed');
      localStorage.setItem('navCollapsed', collapsed);
    } else {
      root.classList.toggle('nav-open');
    }
  }

  // Shared dark mode toggle (available on every page)
  if (typeof toggleDarkMode !== 'function') {
    window.toggleDarkMode = function () {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('darkMode', isDark);
      document.dispatchEvent(new CustomEvent('darkmodechange', { detail: { isDark } }));
      // Chart.js colors are baked in at render time - repaint if the page has a chart
      if (typeof renderChart === 'function') { try { renderChart(); } catch (e) {} }
    };
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeNav();
  });

  // Tapping a link navigates - close first so the drawer isn't mid-slide on the next page
  document.querySelectorAll('#sidebar [data-nav]').forEach((el) => {
    el.addEventListener('click', closeNav);
  });

  // Swipe left on the drawer to dismiss it
  (function () {
    const el = document.getElementById('sidebar');
    let startX = null, startY = null;
    el.addEventListener('touchstart', (e) => {
      if (isDesktopNav()) return;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });
    el.addEventListener('touchend', (e) => {
      if (startX === null) return;
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if (dx < -50 && Math.abs(dx) > Math.abs(dy)) closeNav();
      startX = startY = null;
    });
  })();

  // Highlight active link
  (function () {
    const path = location.pathname.replace(/\/$/, '') || '/';
    document.querySelectorAll('#sidebar [data-nav]').forEach((el) => {
      const active = el.getAttribute('data-nav') === path;
      el.className = 'nav-link ' + (active
        ? 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400'
        : 'text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 hover:text-gray-900 dark:hover:text-white');
      if (active) el.setAttribute('aria-current', 'page');
    });
    const label = document.querySelector('#sidebar [data-nav="' + path + '"] span');
    if (label) document.getElementById('navStatusLine').textContent = label.textContent;
  })();
</script>
