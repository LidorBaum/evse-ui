<!-- ==== Action sheet (shared partial) ==== -->
<!-- Bottom sheet on mobile, centred dialog on >=640px. Drive it with openActionSheet(). -->
<style>
  #actionSheet { position: fixed; inset: 0; z-index: 60; visibility: hidden; }
  #actionSheet.open { visibility: visible; }
  html.sheet-open, html.sheet-open body { overflow: hidden; }
  #actionSheetBackdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, .5);
    opacity: 0;
    transition: opacity .2s ease;
  }
  #actionSheet.open #actionSheetBackdrop { opacity: 1; }
  #actionSheetPanel {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    max-height: 85vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    transform: translateY(100%);
    transition: transform .25s cubic-bezier(.4, 0, .2, 1);
    padding-bottom: calc(env(safe-area-inset-bottom) + .5rem);
  }
  #actionSheet.open #actionSheetPanel { transform: translateY(0); }
  .sheet-item {
    display: flex;
    align-items: center;
    gap: .875rem;
    width: 100%;
    min-height: 3.25rem;
    padding: .75rem 1rem;
    border-radius: .75rem;
    font-size: 1rem;
    font-weight: 500;
    text-align: left;
  }
  .sheet-item svg { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }
  @media (min-width: 640px) {
    #actionSheetPanel {
      left: 50%;
      right: auto;
      top: 50%;
      bottom: auto;
      width: 22rem;
      border-radius: 1rem;
      opacity: 0;
      transform: translate(-50%, -46%);
      transition: opacity .18s ease, transform .18s ease;
      padding-bottom: .5rem;
    }
    #actionSheet.open #actionSheetPanel { opacity: 1; transform: translate(-50%, -50%); }
  }
</style>

<div id="actionSheet" role="dialog" aria-modal="true" aria-hidden="true">
  <div id="actionSheetBackdrop" onclick="closeActionSheet()"></div>
  <div id="actionSheetPanel" class="bg-white dark:bg-gray-800 rounded-t-2xl shadow-2xl">
    <div class="sm:hidden pt-2 pb-1 flex justify-center">
      <div class="w-10 h-1.5 rounded-full bg-gray-300 dark:bg-gray-600"></div>
    </div>
    <div class="px-4 pt-2 pb-1 flex items-start gap-3">
      <div class="min-w-0 flex-1">
        <div id="sheetTitle" class="font-semibold text-gray-900 dark:text-white truncate"></div>
        <div id="sheetSubtitle" class="text-xs text-gray-500 dark:text-gray-400 truncate"></div>
      </div>
      <button onclick="closeActionSheet()" class="icon-btn text-gray-400 hover:text-gray-700 dark:hover:text-white" title="Close" aria-label="Close">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="sheetActions" class="p-2 pt-1 space-y-1"></div>
  </div>
</div>

<script>
  let _sheetActions = [];

  /**
   * openActionSheet({ title, subtitle, actions })
   * actions: [{ label, hint?, icon?, danger?, run() }]
   */
  function openActionSheet(opts) {
    _sheetActions = (opts.actions || []).filter(Boolean);
    document.getElementById('sheetTitle').textContent = opts.title || '';
    document.getElementById('sheetSubtitle').textContent = opts.subtitle || '';
    document.getElementById('sheetActions').innerHTML = _sheetActions.map((a, i) => {
      const tone = a.danger
        ? 'text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20'
        : 'text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-gray-700';
      return `<button type="button" onclick="runSheetAction(${i})" class="sheet-item ${tone}">
        ${a.icon || ''}
        <span class="min-w-0 flex-1">
          <span class="block truncate">${a.label}</span>
          ${a.hint ? `<span class="block text-xs font-normal text-gray-400 dark:text-gray-500 truncate">${a.hint}</span>` : ''}
        </span>
      </button>`;
    }).join('');
    const sheet = document.getElementById('actionSheet');
    sheet.classList.add('open');
    sheet.setAttribute('aria-hidden', 'false');
    document.documentElement.classList.add('sheet-open');
  }

  function closeActionSheet() {
    const sheet = document.getElementById('actionSheet');
    sheet.classList.remove('open');
    sheet.setAttribute('aria-hidden', 'true');
    document.documentElement.classList.remove('sheet-open');
  }

  function runSheetAction(i) {
    const action = _sheetActions[i];
    closeActionSheet();
    // Let the sheet finish sliding out before a modal takes over the screen
    if (action && typeof action.run === 'function') setTimeout(action.run, 160);
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeActionSheet();
  });

  // Swipe down to dismiss
  (function () {
    const panel = document.getElementById('actionSheetPanel');
    let startY = null;
    panel.addEventListener('touchstart', (e) => { startY = e.touches[0].clientY; }, { passive: true });
    panel.addEventListener('touchend', (e) => {
      if (startY === null) return;
      if (e.changedTouches[0].clientY - startY > 60 && panel.scrollTop <= 0) closeActionSheet();
      startY = null;
    });
  })();
</script>
